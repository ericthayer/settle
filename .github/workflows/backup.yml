name: Backup

# Encrypted pg_dump of the Supabase database, kept as a workflow artifact.
# Runs twice a week, which also keeps a free-tier project from pausing after
# 7 days without activity.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    Supabase → Connect → Session pooler URI, with the database password.
#                      The direct connection is IPv6-only and unreachable from GitHub runners.
#   BACKUP_PASSPHRASE  Long random passphrase. Store a copy in your password manager:
#                      without it the backups can't be opened.
#
# This repository is public, so artifacts are downloadable by any signed-in GitHub
# user and logs are public. The archive is AES-256 encrypted and the script prints
# no data. Restore steps are in README.md.
on:
  schedule:
    - cron: '17 9 * * 1,4' # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=()
          [[ -n "$SUPABASE_DB_URL" ]] || missing+=(SUPABASE_DB_URL)
          [[ -n "$BACKUP_PASSPHRASE" ]] || missing+=(BACKUP_PASSPHRASE)
          if (( ${#missing[@]} )); then
            echo "::error::Add repository secrets: ${missing[*]} (see the header of .github/workflows/backup.yml)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pg-client
      - name: Back up
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          OUT_DIR: backup
        run: bash scripts/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: settle-backup-${{ github.run_id }}
          path: backup/*.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90
          # Already compressed and encrypted.
          compression-level: 0
