# Supabase CLI config for local development (`supabase start`).
# Only settings Settle depends on are listed; CLI defaults cover the rest.
project_id = "settle"

[api]
schemas = ["public"]

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
# Private tool: accounts are created by invite from the dashboard, never by public sign-up.
enable_signup = false

[auth.email]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# The session is verified inside the function: the gateway's verify_jwt check
# doesn't understand publishable keys or JWT signing keys.
[functions.send-invoice-email]
verify_jwt = false

# Called signed out from the shared invoice page; the link token is the credential.
[functions.create-checkout]
verify_jwt = false

# Called by Stripe; the Stripe-Signature header is verified inside the function.
[functions.stripe-webhook]
verify_jwt = false
